<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repo Locator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#0b1016; --line:#263140; --text:#e7eef6; --muted:#8ea0b5; --amber:#f0b429; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; }
  header { display:flex; gap:16px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:#101720; }
  h1 { font-size:18px; margin:0; } h1 span { color:var(--amber); } .sub,.note { color:var(--muted); font-size:12px; }
  .chip { border:1px solid var(--line); background:#1a2330; border-radius:999px; padding:4px 10px; color:var(--muted); } .chip b { color:var(--text); }
  main { display:grid; grid-template-columns:1.15fr .85fr; height:calc(100% - 62px); } #map { height:100%; } .side { display:flex; flex-direction:column; border-left:1px solid var(--line); min-width:0; }
  .toolbar { display:flex; gap:8px; padding:10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  button.filter, #refresh { background:#1a2330; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.filter.on, #refresh { border-color:var(--amber); color:var(--amber); }
  .table-wrap { overflow:auto; flex:1; } table { width:100%; border-collapse:collapse; font-size:12.5px; } th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; } th { position:sticky; top:0; background:#182230; color:var(--muted); } tr { cursor:pointer; } tr:hover,tr.active { background:#1c2836; }
  .note { padding:8px 10px; border-top:1px solid var(--line); } .plane { background:none; border:0; } .leaflet-tooltip.apt { background:#101720; color:#e7eef6; border:1px solid #263140; }
  @media (max-width:900px) { header { padding:8px 10px; } h1 { font-size:16px; } main { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:calc(100% - 52px); } #map { height:168px; min-height:168px; max-height:168px; } .side { border-left:0; border-top:1px solid var(--line); min-height:0; } .toolbar { padding:6px; } }
</style>
</head>
<body>
<header><div><h1><span>REPO</span> LOCATOR</h1><div class="sub" id="sub">Loading flights.json</div></div><div class="chip">Routes <b id="air">0</b></div></header>
<main><div id="map"></div><section class="side"><div class="toolbar"><button id="refresh">Refresh</button><button class="filter on" data-f="all">All repos</button><button class="filter" data-f="9">9xxx</button><button class="filter" data-f="8">8xxx</button><button class="filter" data-f="reg">Regional</button><button class="filter" data-f="cargo">Cargo</button></div><div class="table-wrap"><table><thead><tr><th>Callsign</th><th>Operator</th><th>Origin</th><th>Destination</th><th>Route</th><th>Alt</th></tr></thead><tbody id="rows"></tbody></table></div><div class="note">Every filed route is a line. Click a row to highlight that city pair.</div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let FLIGHTS = [];
const REG = new Set("SKW RPA EDV ENY JIA PDT ASH QXE UCA GJS AWI JZA POE SIL".split(" "));
const CARGO = new Set("GTI UAE QTR FDX UPS CJT KAL AJT CLX MTN BVN IRO CAO CCA".split(" "));
const GA = new Set("C172 C152 C182 C206 C210 PA28 PA32 BE35 BE36 BE58 SR22 CH7A".split(" "));
const regional = f => f.regional || REG.has((f.callsign||"").slice(0,3));
const color = f => f.cargo ? "#b388ff" : regional(f) ? "#7ddea2" : f.band === "9" ? "#f0b429" : "#3ec6e0";
const flying = f => f.lat != null && f.alt !== "ground" && f.alt !== "filed" && Number(f.alt) > 100;
const keep = f => /^[A-Z]{3}[89]\d{3}$/.test(f.callsign||"") && !GA.has((f.type||"").toUpperCase()) && f.alt !== "ground";
const altText = a => a === "filed" ? "FILED" : Number(a).toLocaleString()+" ft";
const map = L.map("map", {worldCopyJump:true}).setView([39,-97], 4);
L.tileLayer("https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_4b02_1_f58b8a12fcfccf5a56049c12", {attribution:"&copy; OSM &copy; CARTO", maxZoom:20}).addTo(map);
const markers = {};
const routeLayer = L.layerGroup().addTo(map);
let active = "all", selected = null;
function planeIcon(f) {
  const h = Number(f.track)||0;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><g transform="rotate(${h} 14 14)"><path d="M14 2 L16.2 12 L24 15.2 L24 17.2 L16.2 15.6 L15.2 24 L17.4 25.4 L17.4 26.6 L14 25.4 L10.6 26.6 L10.6 25.4 L12.8 24 L11.8 15.6 L4 17.2 L4 15.2 L11.8 12 Z" fill="${color(f)}" stroke="#101720" stroke-width="1"/></g></svg>`;
  return L.divIcon({className:"plane", html:svg, iconSize:[28,28], iconAnchor:[14,14]});
}
function show(f){ if(!keep(f)) return false; if(active==="9") return f.band==="9"; if(active==="8") return f.band==="8"; if(active==="reg") return regional(f); if(active==="cargo") return !!f.cargo || CARGO.has((f.callsign||"").slice(0,3)); return true; }
function gc(a,b,n=48){ const r=d=>d*Math.PI/180, lat1=r(a[0]), lon1=r(a[1]), lat2=r(b[0]), lon2=r(b[1]); const d=2*Math.asin(Math.sqrt(Math.sin((lat2-lat1)/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2)); if(!d) return [a,b]; const pts=[]; for(let i=0;i<=n;i++){ const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d); const x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2); const y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2); const z=A*Math.sin(lat1)+B*Math.sin(lat2); pts.push([Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI, Math.atan2(y,x)*180/Math.PI]); } return pts; }
function lineFor(f){ if(f.olat==null||f.dlat==null) return null; const stops=[[f.olat,f.olon]]; if(f.vlat!=null) stops.push([f.vlat,f.vlon]); stops.push([f.dlat,f.dlon]); let line=[]; for(let i=0;i<stops.length-1;i++) line.push(...gc(stops[i], stops[i+1])); return line; }
function select(cs){ selected=cs; document.querySelectorAll("tr").forEach(tr=>tr.classList.toggle("active", tr.dataset.cs===cs)); render(); const f=FLIGHTS.find(x=>x.callsign===cs); const line=f&&lineFor(f); if(line) map.fitBounds(L.latLngBounds(line).pad(0.3)); }
function render(){
  routeLayer.clearLayers();
  Object.values(markers).forEach(m=>map.removeLayer(m));
  for (const k in markers) delete markers[k];
  const shown=FLIGHTS.filter(show);
  shown.forEach(f=>{
    const line=lineFor(f);
    if(!line) return;
    const on=f.callsign===selected;
    const pl=L.polyline(line,{color:color(f),weight:on?4:2,opacity:on?1:0.75}).bindTooltip(`${f.callsign} ${f.origin} \u2192 ${f.dest}`,{sticky:true});
    pl.on("click",()=>select(f.callsign));
    routeLayer.addLayer(pl);
    if(on){
      [[f.olat,f.olon,f.origin],[f.dlat,f.dlon,f.dest]].forEach(([la,lo,name])=>{
        routeLayer.addLayer(L.circleMarker([la,lo],{radius:5,color:"#fff",weight:2,fillColor:color(f),fillOpacity:1}).bindTooltip(name,{permanent:true,direction:"top",className:"apt"}));
      });
    }
    if(flying(f)){
      const m=L.marker([f.lat,f.lon],{icon:planeIcon(f),zIndexOffset:500}).addTo(map);
      m.on("click",()=>select(f.callsign));
      markers[f.callsign]=m;
    }
  });
  document.getElementById("rows").innerHTML=shown.map(f=>`<tr data-cs="${f.callsign}"><td><b>${f.callsign}</b></td><td>${f.op}${regional(f)?" \u00b7 regional":""}</td><td>${f.origin}</td><td>${f.dest}</td><td>${f.route||"\u2014"}</td><td>${altText(f.alt)}</td></tr>`).join("");
  document.getElementById("air").textContent=shown.filter(f=>lineFor(f)).length;
  document.querySelectorAll("#rows tr").forEach(tr=>tr.addEventListener("click",()=>select(tr.dataset.cs)));
}
async function refresh(){
  const btn=document.getElementById("refresh");
  btn.textContent="Refreshing";
  try {
    const data = await (await fetch("flights.json?t="+Date.now(), {cache:"no-store"})).json();
    FLIGHTS = (data.flights||[]).filter(keep);
    document.getElementById("sub").textContent="Updated "+(data.updated||"")+" \u00b7 "+FLIGHTS.length+" commercial";
  } catch(e) {
    document.getElementById("sub").textContent="Could not load flights.json";
  }
  render();
  btn.textContent="Refresh";
  setTimeout(()=>map.invalidateSize(), 200);
}
document.querySelectorAll("button.filter").forEach(b=>b.addEventListener("click",()=>{ document.querySelectorAll("button.filter").forEach(x=>x.classList.remove("on")); b.classList.add("on"); active=b.dataset.f; render(); }));
document.getElementById("refresh").addEventListener("click", refresh);
refresh();
setInterval(refresh, 60*1000);
</script>
</body>
</html>

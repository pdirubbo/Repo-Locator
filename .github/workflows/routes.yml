name: Fill routes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Refresh ADS-B", "Refresh repos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fill-routes
  cancel-in-progress: false

jobs:
  routes:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TFMS client
        run: pip install solace-pubsubplus
      - name: Fill missing routes
        env:
          SWIM_PASSWORD: ${{ secrets.SWIM_PASSWORD }}
        run: python scripts/fill_routes.py
      - name: Commit routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.json
          if git diff --cached --quiet; then
            echo "No route change"
          else
            git commit -m "Fill missing repo routes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

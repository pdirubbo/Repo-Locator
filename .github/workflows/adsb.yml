name: Refresh SWIM repos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-swim
  cancel-in-progress: true

jobs:
  swim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TFMS client
        run: pip install solace-pubsubplus
      - name: Read TFMS flight plans
        env:
          SWIM_PASSWORD: ${{ secrets.SWIM_PASSWORD }}
        run: python scripts/refresh_swim.py
      - name: Commit flights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.json
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "TFMS SWIM repo flights"
          git pull --rebase origin main
          git push origin HEAD:main
